[pytest]
addopts =
    -v
    --alluredir=allure-results
    --reruns 1
    --reruns-delay 2

markers =
    api: api tests
    attributes: attributes domain tests
    contacts: contacts domain tests
    export: export tests
    import_: import tests
    smoke: smoke tests
    regress: regression tests
    ng: negative tests
    e2e: end to end tests
    company: company domain tests
    employee: employee domain tests
    accounts: accounts domain tests
    mobile: mobile app domain tests
    cultures: cultures domain tests
    external: external integration tests
    test_script_runs: script run tests (multi-run stability scenarios, use --runs=N)
